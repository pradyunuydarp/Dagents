name: CI

# The pipeline is built around one rule: a green run must mean something.
#
# This repository has two specific ways of going falsely green, both already
# hit at least once, and both are actively defended against here:
#
#   1. The governance and federation tests skip when `dagentsc` is missing. A
#      suite that skips its governance tests is green without having proved
#      anything, so the `planners` job builds the binary, every Python job that
#      needs it downloads it, and `scripts/ci_no_skipped_tests.py` fails the
#      run if those tests skipped anyway. The same guard fails the run when the
#      database tests or the chart rendering tests skip in a job that provides
#      PostgreSQL or matplotlib.
#   2. `core-service` has two manifest renderers — the OCaml compiler and a
#      Python fallback — and they silently diverged because the suite only ever
#      exercised the fallback. The `framework-services` job runs that suite
#      twice, with and without `DAGENTSC_BIN`.
#
# The frontend smoke test gets the same treatment: it exits 2 and prints SKIP
# when no browser is available, and a job that treated 2 as success would be
# reporting a pass for a test that never ran.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  # Where the planner artifact is unpacked in the jobs that need it.
  PLANNER_DIR: ${{ github.workspace }}/planner

jobs:
  # ---------------------------------------------------------------------------
  # The pure functional layer. Fastest feedback in the repo: no Docker, no
  # database, no GPU — and everything downstream depends on its binary.
  # ---------------------------------------------------------------------------
  planners:
    name: OCaml planners
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.1"
          dune-cache: true
          # The opam file lives under bindings/ocaml, not at the repository
          # root, so the action's automatic pinning has nothing to find here.
          # Installing the two dependencies explicitly is more predictable.
          opam-pin: false

      - name: Install OCaml dependencies
        run: opam install --yes dune yojson

      - name: Build dagentsc
        working-directory: bindings/ocaml
        run: opam exec -- dune build ./bin/dagentsc.exe

      - name: Test the compilers
        working-directory: bindings/ocaml
        run: opam exec -- dune test --display short

      - name: Check the planner answers
        # A binary that builds but cannot serve a request would let every
        # downstream job "have the planner" and still skip nothing useful.
        run: |
          ./bindings/ocaml/_build/default/bin/dagentsc.exe model route \
            --task classification --output json

      - uses: actions/upload-artifact@v4
        with:
          name: dagentsc
          path: bindings/ocaml/_build/default/bin/dagentsc.exe
          if-no-files-found: error
          retention-days: 1

      - name: Build the statically linked planner for the wheel
        # The packaging job puts this binary into a Linux wheel, as the
        # release workflow does. A manylinux tag needs a static binary, and
        # hatch_build.py refuses any other. It is built after the upload
        # above, so the other jobs keep the planner they always had.
        working-directory: bindings/ocaml
        run: |
          opam exec -- dune build --profile static ./bin/dagentsc.exe
          file _build/default/bin/dagentsc.exe
          file _build/default/bin/dagentsc.exe | grep -q "statically linked"
          ./_build/default/bin/dagentsc.exe model route --task classification --output json
          mkdir -p "${RUNNER_TEMP}/planner-static"
          cp _build/default/bin/dagentsc.exe "${RUNNER_TEMP}/planner-static/dagentsc-linux-x86_64"

      - uses: actions/upload-artifact@v4
        with:
          name: dagentsc-static
          path: ${{ runner.temp }}/planner-static/dagentsc-linux-x86_64
          if-no-files-found: error
          retention-days: 1

  # ---------------------------------------------------------------------------
  # The agent layer and the control plane, with the planner reachable so the
  # governance and federation tests actually run.
  # ---------------------------------------------------------------------------
  agents:
    name: Agents and governance
    runs-on: ubuntu-latest
    needs: planners
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            dagents/*/requirements.txt

      - uses: actions/download-artifact@v4
        with:
          name: dagentsc
          path: ${{ env.PLANNER_DIR }}

      - name: Make the planner executable
        run: chmod +x "${PLANNER_DIR}/dagentsc.exe"

      - name: Install dependencies
        # matplotlib and numpy are not in the agents' requirements, because the
        # agents draw no charts and charts.py imports matplotlib only when it
        # draws one. They are installed here so the chart rendering tests run.
        # The ranges match apps/healthcare-demo/requirements.txt;
        # tests/test_ci_guards.py checks that. httpx, which the agent client
        # and the test client use, is in the agents' requirements. PyYAML is
        # not in them either: only compose_apply.py reads YAML, and it imports
        # PyYAML when it parses a file. It is installed so the appliers' tests
        # run, in the range of apps/healthcare-demo/requirements.txt.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r dagents/lma/requirements.txt \
                                -r dagents/gma/requirements.txt \
                                "matplotlib>=3.9,<4" \
                                "numpy>=2,<3" \
                                "pyyaml>=6.0,<7"

      - name: Run the agent suite
        env:
          DAGENTSC_BIN: ${{ env.PLANNER_DIR }}/dagentsc.exe
        run: |
          set -o pipefail
          python -m unittest discover -s dagents/tests -t . -v 2>&1 | tee agents-suite.log

      - name: Fail if the governance or chart tests skipped
        # This job has no database, so the database tests in dagents/tests
        # skip here. They run in the demo-apps job, which has a PostgreSQL
        # service. --forbid planner covers every planner test; the classes
        # below must also have run: the Guard, the round controller, the
        # charts, the LMA's federated jobs, the GMA's HTTP engine and release,
        # the agent client over a real loopback socket, the update upload
        # while every GMA thread token is held, the refused approval on the
        # simulator, a whole study through the GMA and three LMAs, in process
        # and as separate uvicorn processes, a site that joins the GMA while
        # it runs (its job reaches an LMA served by uvicorn), and the appliers
        # that start one rendered Compose service as a process or with docker
        # compose.
        run: |
          python scripts/ci_no_skipped_tests.py \
            --forbid planner \
            --forbid charts \
            --require-ran dagents.tests.test_governance.EthicalGuardTests \
            --require-ran dagents.tests.test_federation.RoundLifecycleTests \
            --require-ran dagents.tests.test_charts.RenderTests \
            --require-ran dagents.tests.test_lma_federation_jobs.OfferTests \
            --require-ran dagents.tests.test_lma_federation_jobs.ExecuteTests \
            --require-ran dagents.tests.test_lma_federation_jobs.RunTests \
            --require-ran dagents.tests.test_gma_http_engine.HttpEngineTests \
            --require-ran dagents.tests.test_gma_http_engine.UploadThreadTests \
            --require-ran dagents.tests.test_gma_release.ReleaseEvaluationTests \
            --require-ran dagents.tests.test_gma_release.SimulatorRoundFlowTests \
            --require-ran dagents.tests.test_agent_client.NetworkClientTests \
            --require-ran dagents.tests.test_agent_network_flow.InProcessStudyTests \
            --require-ran dagents.tests.test_agent_network_flow.OverHttpStudyTests \
            --require-ran dagents.tests.test_gma_site_addresses.SiteAddressBookTests \
            --require-ran dagents.tests.test_gma_site_addresses.SiteAddressRouteTests \
            --require-ran dagents.tests.test_gma_site_addresses.OverHttpJoinTests \
            --require-ran dagents.tests.test_compose_apply.LocalProcessApplierTests \
            --require-ran dagents.tests.test_compose_apply.LocalProcessEnvFileTests \
            --require-ran dagents.tests.test_compose_apply.DockerComposeApplierTests \
            agents-suite.log

      - name: Run the getting-started example and check the guide
        # examples/getting-started is the worked example of docs/guide. The
        # test runs each of its steps against the real planner and checks that
        # every code and output block in the guide matches the example. The
        # contracts job also runs this file with the planner; this step adds
        # the skip guard that requires ExampleRunTests to have run.
        env:
          DAGENTSC_BIN: ${{ env.PLANNER_DIR }}/dagentsc.exe
        run: |
          set -o pipefail
          python -m unittest tests.test_getting_started_example -v 2>&1 | tee example-suite.log

      - name: Fail if the example's planner tests skipped
        run: |
          python scripts/ci_no_skipped_tests.py \
            --forbid planner \
            --require-ran tests.test_getting_started_example.ExampleRunTests \
            example-suite.log

  # ---------------------------------------------------------------------------
  # core / pipeline / model. core-service runs twice on purpose.
  # ---------------------------------------------------------------------------
  framework-services:
    name: Framework services
    runs-on: ubuntu-latest
    needs: planners
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            services/*/requirements*.txt

      - uses: actions/download-artifact@v4
        with:
          name: dagentsc
          path: ${{ env.PLANNER_DIR }}

      - name: Make the planner executable
        run: chmod +x "${PLANNER_DIR}/dagentsc.exe"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r services/core-service/requirements.txt \
                                -r services/pipeline-service/requirements.txt \
                                -r services/model-service/requirements.txt \
                                -r services/model-service/requirements-optional-models.txt \
                                httpx
        # The optional Hugging Face stack is installed so the model-inventory
        # provider tests exercise the real `local_files_only` behaviour instead
        # of skipping the one test that validates our error translation.

      - name: core-service with the OCaml manifest compiler
        env:
          DAGENTSC_BIN: ${{ env.PLANNER_DIR }}/dagentsc.exe
          PYTHONPATH: .:services/core-service
        run: python -m unittest discover -s services/core-service/tests -t services/core-service/tests

      - name: core-service with the Python fallback
        # Same assertions, other implementation. The two renderers diverged once
        # because only this path was ever run; now neither path is optional.
        env:
          PYTHONPATH: .:services/core-service
        run: python -m unittest discover -s services/core-service/tests -t services/core-service/tests

      - name: pipeline-service
        env:
          PYTHONPATH: .:services/pipeline-service
        run: python -m unittest discover -s services/pipeline-service/tests -t services/pipeline-service/tests

      - name: model-service
        env:
          PYTHONPATH: .:services/model-service
        run: |
          set -o pipefail
          python -m unittest discover -s services/model-service/tests \
            -t services/model-service/tests -v 2>&1 | tee model-service.log

      - name: Fail if the Hugging Face provider tests skipped
        # This job installs the optional stack, so a skip here means the
        # requirements file and the test's own check have drifted apart.
        run: |
          if grep -q "transformers is not installed" model-service.log; then
            echo "The Hugging Face provider tests skipped even though the optional" >&2
            echo "requirements were installed. Check" >&2
            echo "services/model-service/requirements-optional-models.txt." >&2
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # Cross-service contracts: the endpoint inventory, and the conventions the
  # contributor guide states. Needs every Python service importable.
  # ---------------------------------------------------------------------------
  contracts:
    name: Service inventory and API conventions
    runs-on: ubuntu-latest
    # The API reference's examples are replayed with the planner.
    needs: planners
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            dagents/*/requirements.txt
            services/*/requirements.txt
            services/nl2sql-demo/backend/requirements.txt
            apps/healthcare-demo/requirements.txt

      - uses: actions/download-artifact@v4
        with:
          name: dagentsc
          path: ${{ env.PLANNER_DIR }}

      - name: Make the planner executable
        run: chmod +x "${PLANNER_DIR}/dagentsc.exe"

      # The replay starts spring-control-service from its jar to make its API
      # examples again (the `runner` in its examples request file), and
      # tests/test_spring_services_e2e.py starts spring-core-service from its
      # jar with the planner.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build the Spring service jars
        run: >-
          mvn --batch-mode --no-transfer-progress -f services/spring-services/pom.xml
          -pl spring-control-service,spring-core-service -am package -DskipTests

      # tests/test_social_previews.py runs each frontend's link preview plugin
      # (social-meta.mjs) with Node. The plugin imports nothing, so no
      # npm install is needed.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install every service's dependencies
        # The inventory is extracted by importing each FastAPI app, so this job
        # genuinely needs all of them. That is the cost of checking the contract
        # against the code rather than against a document.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r dagents/lma/requirements.txt \
                                -r dagents/gma/requirements.txt \
                                -r services/core-service/requirements.txt \
                                -r services/pipeline-service/requirements.txt \
                                -r services/model-service/requirements.txt \
                                -r services/nl2sql-demo/backend/requirements.txt \
                                -r apps/healthcare-demo/requirements.txt
          # tests/test_site_resources.py reads the text of each published PDF.
          python -m pip install pymupdf==1.28.2
          # tests/test_social_previews.py reads the steps of pages.yml.
          python -m pip install pyyaml==6.0.3

      - name: The committed inventory matches the code
        run: python scripts/service_inventory.py --check

      - name: The API reference data matches the code
        run: python scripts/api_reference.py --check

      - name: Cross-service contract tests
        # tests/test_api_examples.py makes every captured API example request
        # again with the planner and compares the answers.
        env:
          DAGENTSC_BIN: ${{ env.PLANNER_DIR }}/dagentsc.exe
        run: |
          set -o pipefail
          python -m unittest discover -s tests -t . -v 2>&1 | tee contracts-suite.log

      - name: Fail if the API example replay, the Spring process or the link preview plugin tests skipped
        # The plugin tests skip without Node, and the Spring process tests
        # without Java or the jar, so those classes must have run.
        run: |
          python scripts/ci_no_skipped_tests.py \
            --forbid planner \
            --require-ran tests.test_api_examples.ApiExampleReplayTests \
            --require-ran tests.test_social_previews.SocialMetaPluginTests \
            --require-ran tests.test_spring_services_e2e.SpringCoreProcessTests \
            contracts-suite.log

  # ---------------------------------------------------------------------------
  # The JVM control and core services.
  # ---------------------------------------------------------------------------
  spring:
    name: Spring services
    runs-on: ubuntu-latest
    # ProcessManifestCompilerGatewayTest runs the planner and compares the
    # gateway's answer with the planner's.
    needs: planners
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dagentsc
          path: ${{ env.PLANNER_DIR }}

      - name: Make the planner executable
        run: chmod +x "${PLANNER_DIR}/dagentsc.exe"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and test
        # The gateway test fails when DAGENTSC_BIN names no planner it can run.
        # Without DAGENTSC_BIN it looks for the dune build, which this job does
        # not have, and skips.
        env:
          DAGENTSC_BIN: ${{ env.PLANNER_DIR }}/dagentsc.exe
        run: mvn --batch-mode --no-transfer-progress -f services/spring-services/pom.xml verify

      - name: Fail if the planner test skipped
        # Maven passes the build when a test skips, so read the test's report.
        run: |
          report=services/spring-services/spring-core-service/target/surefire-reports/TEST-io.dagents.spring.core.compiler.ProcessManifestCompilerGatewayTest.xml
          if [ ! -f "$report" ]; then
            echo "::error::$report is missing, so ProcessManifestCompilerGatewayTest did not run."
            exit 1
          fi
          if ! grep -q '<testcase name="consumesJsonFromOcamlCompilerProcess' "$report"; then
            echo "::error::$report has no consumesJsonFromOcamlCompilerProcess test."
            exit 1
          fi
          if ! grep -Eq '<testsuite [^>]*skipped="0"' "$report"; then
            echo "::error::A test in ProcessManifestCompilerGatewayTest skipped. The job sets DAGENTSC_BIN, so check the planner steps."
            exit 1
          fi
          echo "ProcessManifestCompilerGatewayTest ran with the planner and nothing skipped."

  # ---------------------------------------------------------------------------
  # The consumer apps. Both prove the framework is consumable; the healthcare
  # suite also carries the governance and federation assertions for the demo.
  # The healthcare store and site isolation tests, the demo in network mode,
  # and the framework's database tests need a real PostgreSQL 16, so this job
  # runs one as a service container and fails if those tests skip.
  # ---------------------------------------------------------------------------
  demo-apps:
    name: Demo app backends
    runs-on: ubuntu-latest
    needs: planners
    services:
      # A throwaway database. The tests create a scratch database in it, add
      # Supabase's roles (supabase/emulate_supabase_roles.sql) and apply the
      # migrations as a non-superuser.
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            apps/healthcare-demo/requirements.txt
            services/core-service/requirements.txt
            services/nl2sql-demo/backend/requirements.txt

      - uses: actions/download-artifact@v4
        with:
          name: dagentsc
          path: ${{ env.PLANNER_DIR }}

      - name: Make the planner executable
        run: chmod +x "${PLANNER_DIR}/dagentsc.exe"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r apps/healthcare-demo/requirements.txt \
                                -r services/core-service/requirements.txt \
                                -r services/nl2sql-demo/backend/requirements.txt

      - name: healthcare-demo
        # The demo calls the LMAs and the GMA only through their HTTP APIs.
        # Most tests build the agents inside the API process.
        # tests/test_network_mode.py starts the GMA, one LMA per hospital and
        # the API as separate uvicorn processes on loopback ports the system
        # picks, against the service container, and checks that their pilot
        # equals the in-process pilot. tests/test_network_deploy.py also starts
        # core-service from services/core-service and adds Hospital 290 to the
        # running processes.
        working-directory: apps/healthcare-demo
        env:
          DAGENTSC_BIN: ${{ env.PLANNER_DIR }}/dagentsc.exe
          PYTHONPATH: ../..:backend
          HEALTHCARE_DEMO_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: |
          set -o pipefail
          python -m unittest discover -s tests -t . -v 2>&1 | tee healthcare-suite.log

      - name: Fail if the healthcare governance or deployment tests skipped
        # ComposeOverrideTests skips without the Docker command line and its
        # compose plugin, ComposeRequestTests without the planner, and
        # NetworkScriptDeployTests without bash and curl. The runner has all of
        # them, so --require-ran fails the step if one of them did not run.
        # The Docker tests only run `docker compose config`; no container
        # starts. ComposeOverrideTests checks that only the API gets the Docker
        # socket and that the API and the UI are published on 127.0.0.1 only.
        run: |
          python scripts/ci_no_skipped_tests.py \
            --forbid planner \
            --require-ran tests.test_compose_override.ComposeOverrideTests \
            --require-ran tests.test_deployment_spec.ComposeRequestTests \
            --require-ran tests.test_network_deploy.NetworkScriptDeployTests \
            apps/healthcare-demo/healthcare-suite.log

      - name: Framework database tests against PostgreSQL
        # These modules also run in the agents job, which has no database, so
        # their database tests skip there. They run here: role scoping, the
        # connection lease, the model store and registry, the LMA job log, the
        # GMA's coordinator wiring, the GMA's round, enrolment and update
        # stores with the controller tests run on them, a GMA that builds
        # those stores from its table settings and is restarted inside the
        # test process, and a GMA process killed with SIGKILL and started
        # again on its port (it starts the GMA and three LMAs on loopback
        # ports 9800-9899). The registry, the GMA
        # and the controller tests also need the planner. The job installs
        # only the healthcare demo's requirements, the set its image installs,
        # so a framework dependency the demo lacks fails here.
        env:
          DAGENTSC_BIN: ${{ env.PLANNER_DIR }}/dagentsc.exe
          DAGENTS_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: |
          set -o pipefail
          python -m unittest -v \
            dagents.tests.test_postgres_roles \
            dagents.tests.test_postgres_lease \
            dagents.tests.test_model_registry \
            dagents.tests.test_job_log \
            dagents.tests.test_gma_release \
            dagents.tests.test_round_store \
            dagents.tests.test_gma_settings \
            dagents.tests.test_gma_restart \
            dagents.tests.test_gma_process_restart \
            2>&1 | tee framework-database.log

      - name: Fail if the database tests skipped
        # Every database skip starts with "database test skipped". Here a skip
        # means the service container or the connection string is wrong.
        # --require-ran also catches a class whose tests did not run for a
        # reason the pattern does not match. Both logs are checked before the
        # step fails, so one run reports every problem. healthcare-data.yml
        # requires the same classes; tests/test_ci_guards.py checks that, and
        # that every database class in dagents/tests and the healthcare tests
        # is listed here.
        run: |
          status=0
          python scripts/ci_no_skipped_tests.py \
            --forbid database \
            --require-ran tests.test_site_isolation.SiteIsolationTests \
            --require-ran tests.test_site_isolation.PostgresFifteenGrantTests \
            --require-ran tests.test_site_isolation.RolloutFromV2Tests \
            --require-ran tests.test_site_store.PostgresSiteStoreTests \
            --require-ran tests.test_site_store.PostgresCoordinatorStoreTests \
            --require-ran tests.test_pilot_postgres.PostgresPilotTests \
            --require-ran tests.test_pilot_postgres.SeparateLoginTests \
            --require-ran tests.test_pilot_postgres.PostgresApprovalAfterRestartTests \
            --require-ran tests.test_pilot_postgres.PostgresRestartTests \
            --require-ran tests.test_data_entry_flow.PostgresDataEntryTests \
            --require-ran tests.test_store_connections.PostgresConnectionReuseTests \
            --require-ran tests.test_store_connections.PostgresPilotConnectionTests \
            --require-ran tests.test_api_postgres.PostgresApiTests \
            --require-ran tests.test_api_postgres.UnmigratedDatabaseApiTests \
            --require-ran tests.test_data_source_status.PostgresStatusTests \
            --require-ran tests.test_agents_wiring.PostgresWiringTests \
            --require-ran tests.test_concurrency.PostgresPilotWhileWritingTests \
            --require-ran tests.test_network_mode.NetworkModeTests \
            --require-ran tests.test_network_mode.NetworkApprovalTests \
            --require-ran tests.test_network_deploy.NetworkDeployTests \
            apps/healthcare-demo/healthcare-suite.log || status=1
          python scripts/ci_no_skipped_tests.py \
            --forbid database \
            --forbid planner \
            --require-ran dagents.tests.test_postgres_roles.ActingAsTests \
            --require-ran dagents.tests.test_postgres_roles.ConnectTests \
            --require-ran dagents.tests.test_postgres_roles.AdapterRoleTests \
            --require-ran dagents.tests.test_postgres_roles.PostgresAuditSinkTests \
            --require-ran dagents.tests.test_postgres_lease.KeptConnectionPostgresTests \
            --require-ran dagents.tests.test_postgres_lease.LeaseErrorTextPostgresTests \
            --require-ran dagents.tests.test_postgres_lease.LeaseAuditSinkPostgresTests \
            --require-ran dagents.tests.test_postgres_lease.SourceAdapterPostgresTests \
            --require-ran dagents.tests.test_model_registry.PostgresModelStoreTests \
            --require-ran dagents.tests.test_model_registry.PostgresModelRegistryTests \
            --require-ran dagents.tests.test_job_log.PostgresJobLogTests \
            --require-ran dagents.tests.test_gma_release.GmaPostgresWiringTests \
            --require-ran dagents.tests.test_round_store.PostgresRoundRepositoryTests \
            --require-ran dagents.tests.test_round_store.PostgresEnrolmentStoreTests \
            --require-ran dagents.tests.test_round_store.PostgresUpdateStoreTests \
            --require-ran dagents.tests.test_round_store.PostgresRoundRecoveryTests \
            --require-ran dagents.tests.test_round_store.PostgresRoundLifecycleTests \
            --require-ran dagents.tests.test_round_store.PostgresRoundStateTests \
            --require-ran dagents.tests.test_round_store.PostgresSiteRefusalTests \
            --require-ran dagents.tests.test_round_store.PostgresNonFiniteRequestTests \
            --require-ran dagents.tests.test_gma_settings.PostgresSettingsWiringTests \
            --require-ran dagents.tests.test_gma_restart.StudyRestartTests \
            --require-ran dagents.tests.test_gma_restart.CrashWindowRestartTests \
            --require-ran dagents.tests.test_gma_restart.InMemoryStateRestartTests \
            --require-ran dagents.tests.test_gma_restart.RecoveryRestartTests \
            --require-ran dagents.tests.test_gma_restart.PostgresUploadThreadTests \
            --require-ran dagents.tests.test_gma_process_restart.GmaProcessRestartTests \
            framework-database.log || status=1
          exit "${status}"

      - name: nl2sql-demo
        run: python -m unittest discover -s services/nl2sql-demo/tests -t services/nl2sql-demo/tests

  # ---------------------------------------------------------------------------
  # The frontends. A typecheck and a bundle prove the app compiles and nothing
  # about whether it works, so the healthcare app is also driven in a browser.
  # ---------------------------------------------------------------------------
  frontends:
    name: Frontends
    runs-on: ubuntu-latest
    needs: planners
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            site/package-lock.json
            apps/healthcare-demo/frontend/package-lock.json
            services/nl2sql-demo/frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/healthcare-demo/requirements.txt

      - uses: actions/download-artifact@v4
        with:
          name: dagentsc
          path: ${{ env.PLANNER_DIR }}

      - name: Make the planner executable
        run: chmod +x "${PLANNER_DIR}/dagentsc.exe"

      - name: The design system is in sync
        # Three frontends share one design system by generated copy, because the
        # healthcare demo has to stay extractable into its own repository and
        # cannot import across the tree. Editing a copy instead of the source is
        # the mistake this catches.
        run: python scripts/sync_design_system.py --check

      - name: Build the framework site
        working-directory: site
        run: |
          npm ci
          npm run build

      - name: Build the nl2sql frontend
        working-directory: services/nl2sql-demo/frontend
        run: |
          npm ci
          npm run build

      - name: Build the healthcare frontend
        working-directory: apps/healthcare-demo/frontend
        run: |
          npm ci
          npm run build

      - name: Install the backend the smoke test drives
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r apps/healthcare-demo/requirements.txt

      - name: Install a browser for the smoke test
        working-directory: apps/healthcare-demo/frontend
        run: npx playwright install --with-deps chromium

      - name: Locate the browser
        # `smoke.mjs` searches `CHROMIUM_PATH` first, then a list of paths that
        # covers the container image this repo develops in — none of which
        # exists on a GitHub runner. Resolving the path here, and failing if it
        # is not found, is what stops the smoke test reporting SKIP. The path
        # points at the real binary rather than a symlink, because Chrome loads
        # resources from its own directory.
        working-directory: apps/healthcare-demo/frontend
        run: |
          browser="$(node -e \
            "console.log(require('playwright-core').chromium.executablePath())" \
            2>/dev/null || true)"
          if [ ! -x "${browser}" ]; then
            browser="$(find "${HOME}/.cache/ms-playwright" -type f -name 'chrome' \
              -perm -u+x 2>/dev/null | head -1)"
          fi
          if [ ! -x "${browser}" ]; then
            echo "No browser found. The smoke test would report SKIP, which is not a pass." >&2
            exit 1
          fi
          echo "Using ${browser}"
          echo "CHROMIUM_PATH=${browser}" >> "$GITHUB_ENV"

      - name: Check the framework site in a browser
        # Visits every guide page, draws every Mermaid diagram, loads every
        # image, follows the links between pages, and checks that every API
        # reference page shows each endpoint where docs/reference/api places
        # it, that its anchors resolve, and that its code tabs switch. It
        # also fetches every deck and PDF on the Resources page and checks each
        # file's first bytes, and checks the home page's link preview tags and
        # that its card and icons load. A diagram with a syntax error only fails in a
        # browser, so the build above cannot catch it. Exit 2 (no browser)
        # fails this step.
        working-directory: site
        run: npm run check

      - name: Smoke-test the real UI against a live backend
        # `run_frontend_demo.sh --check` starts the backend and the Vite dev
        # server, waits for both, runs the smoke test, and exits. Without
        # `dagentsc` the Ethical Guard would deny every request and the script
        # refuses to start, which is why this job needs the planner artifact.
        env:
          DAGENTSC_BIN: ${{ env.PLANNER_DIR }}/dagentsc.exe
          PYTHON: python
        run: |
          set -o pipefail
          apps/healthcare-demo/scripts/run_frontend_demo.sh --check 2>&1 | tee smoke.log

      - name: Fail if the smoke test skipped
        # The script maps exit 2 to a friendly "skipped" and exits 0, which is
        # right for a developer on a machine without a browser and wrong for CI:
        # a skipped smoke test proves nothing about the UI.
        run: |
          if grep -qi "smoke test skipped\|^SKIP" smoke.log; then
            echo "The frontend smoke test skipped instead of running." >&2
            exit 1
          fi
          grep -q "ok  " smoke.log || {
            echo "The smoke test produced no passing assertions." >&2
            exit 1
          }

  # ---------------------------------------------------------------------------
  # Adding a hospital while the stroke demo runs. The frontends job drives the
  # UI with the agents inside the API, where the panel offers no button. This
  # job runs the demo in network mode with --deploy against PostgreSQL 16, and
  # the smoke test adds Hospital 290 from the page, opens its page and runs a
  # pilot with it.
  # ---------------------------------------------------------------------------
  deploy-smoke:
    name: Add a hospital to the running demo
    runs-on: ubuntu-latest
    needs: planners
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: healthcare_demo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/healthcare-demo/frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            apps/healthcare-demo/requirements.txt
            services/core-service/requirements.txt

      - uses: actions/download-artifact@v4
        with:
          name: dagentsc
          path: ${{ env.PLANNER_DIR }}

      - name: Make the planner executable
        run: chmod +x "${PLANNER_DIR}/dagentsc.exe"

      - name: Install the demo, core-service and the frontend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r apps/healthcare-demo/requirements.txt \
                                -r services/core-service/requirements.txt
          cd apps/healthcare-demo/frontend && npm ci

      - name: Install a browser for the smoke test
        working-directory: apps/healthcare-demo/frontend
        run: npx playwright install --with-deps chromium

      - name: Locate the browser
        # As in the frontends job: a smoke test without a browser reports SKIP,
        # which is not a pass.
        working-directory: apps/healthcare-demo/frontend
        run: |
          browser="$(node -e \
            "console.log(require('playwright-core').chromium.executablePath())" \
            2>/dev/null || true)"
          if [ ! -x "${browser}" ]; then
            browser="$(find "${HOME}/.cache/ms-playwright" -type f -name 'chrome' \
              -perm -u+x 2>/dev/null | head -1)"
          fi
          if [ ! -x "${browser}" ]; then
            echo "No browser found. The smoke test would report SKIP, which is not a pass." >&2
            exit 1
          fi
          echo "CHROMIUM_PATH=${browser}" >> "$GITHUB_ENV"

      - name: Migrate and load the records, Hospital 290's too
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@localhost:5432/healthcare_demo
        run: |
          python apps/healthcare-demo/scripts/apply_migrations.py
          python apps/healthcare-demo/scripts/seed_supabase.py

      - name: Add Hospital 290 from the page
        # --deploy starts core-service, the GMA, one LMA per hospital and the
        # API, all on 127.0.0.1. With --check the smoke test runs every check,
        # then adds the hospital from the page.
        env:
          HEALTHCARE_DEMO_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/healthcare_demo
          DAGENTSC_BIN: ${{ env.PLANNER_DIR }}/dagentsc.exe
          PYTHON: python
        run: |
          set -o pipefail
          apps/healthcare-demo/scripts/run_frontend_demo.sh --deploy --check 2>&1 | tee deploy-smoke.log

      - name: Fail unless the hospital joined
        # The script exits 0 when the smoke test skips; a skip proves nothing.
        run: |
          if grep -qi "smoke test skipped\|^SKIP" deploy-smoke.log; then
            echo "The smoke test skipped instead of running." >&2
            exit 1
          fi
          grep -q "ok  deploy: hospital pl-290 joined" deploy-smoke.log || {
            echo "The smoke test did not report that Hospital 290 joined." >&2
            exit 1
          }

  # ---------------------------------------------------------------------------
  # The framework site publishes docs/ from main, so a code change and the docs
  # it feeds land together. This fails when a change touches a code area that
  # scripts/check_docs_impact.py maps and none of that area's docs, unless a
  # commit message says `Docs-Impact: none [area] (reason)` for that area. The
  # docs-sync skill has the map and the commands that regenerate each doc.
  # ---------------------------------------------------------------------------
  docs-impact:
    name: Docs change with the code
    runs-on: ubuntu-latest
    # A manual run has no change range to compare.
    if: github.event_name != 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
        with:
          # The check diffs the change against its base and reads every commit
          # message in between, so it needs the whole history, not one commit.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Check that the docs changed with the code
        # The commits are passed through env and quoted, never pasted into the
        # script. On a push, `before` is all zeros for a new branch, and after a
        # force push it may be missing from the clone; the script then checks
        # the head commit alone and says so.
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            python scripts/check_docs_impact.py --base "${PR_BASE}" --head "${PR_HEAD}"
          else
            python scripts/check_docs_impact.py --base "${PUSH_BEFORE}" --head "${PUSH_AFTER}"
          fi

  # ---------------------------------------------------------------------------
  # The PyPI package. Builds the sdist and, from it, a Linux x86_64 wheel with
  # the static planner inside, the way .github/workflows/release.yml does, and
  # installs the wheel into clean environments outside the checkout. Then runs
  # the agent suite on the newest versions the package's extras allow, because
  # the agents job tests only the lowest. Nothing is published here.
  # ---------------------------------------------------------------------------
  packaging:
    name: Python package
    runs-on: ubuntu-latest
    needs: planners
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # The versions the classifiers in pyproject.toml list; the last is
          # the default python.
          python-version: |
            3.12
            3.13
            ${{ env.PYTHON_VERSION }}

      - uses: actions/download-artifact@v4
        with:
          name: dagentsc-static
          path: ${{ env.PLANNER_DIR }}

      - name: Build the sdist, then the wheel from the sdist
        # The build backend comes from the pins in .github/build-constraints.txt.
        env:
          PIP_CONSTRAINT: ${{ github.workspace }}/.github/build-constraints.txt
          PIP_BUILD_CONSTRAINT: ${{ github.workspace }}/.github/build-constraints.txt
        run: |
          # Artifacts lose the executable bit; hatch_build.py refuses a planner without it.
          chmod +x "${PLANNER_DIR}/dagentsc-linux-x86_64"
          python -m pip install build==1.6.1 twine==7.0.0
          python -m build --sdist --outdir dist
          mkdir -p "${RUNNER_TEMP}/unpacked"
          tar -xzf dist/dagents-*.tar.gz -C "${RUNNER_TEMP}/unpacked"
          DAGENTS_PLANNER_BINARY="${PLANNER_DIR}/dagentsc-linux-x86_64" \
          DAGENTS_WHEEL_PLATFORM=manylinux_2_17_x86_64.manylinux2014_x86_64.musllinux_1_1_x86_64 \
            python -m build --wheel --outdir dist "${RUNNER_TEMP}"/unpacked/dagents-*
          python -m build --wheel --outdir "${RUNNER_TEMP}/pure" "${RUNNER_TEMP}"/unpacked/dagents-*

      - name: Check the files and the metadata
        run: |
          python scripts/check_dist.py dist --list --require-platform manylinux_2_17_x86_64 \
            --build-constraints .github/build-constraints.txt
          python scripts/check_dist.py "${RUNNER_TEMP}/pure" --build-constraints .github/build-constraints.txt
          python -m twine check --strict dist/* "${RUNNER_TEMP}"/pure/*

      - name: Install the wheel into clean environments and run the smoke test
        # Outside the checkout, with no PYTHONPATH and no DAGENTSC_BIN, so the
        # runner must find the planner inside the wheel. The wheel built
        # without a planner must make the Guard deny. In each environment the
        # smoke test also starts the installed dagents-gma and two dagents-lma
        # processes and runs a federated study between them over HTTP. Without
        # a planner, the GMA must refuse the round and each Guard must deny.
        run: |
          wheel=$(ls "${GITHUB_WORKSPACE}"/dist/*.whl)
          for version in 3.11 3.12 3.13; do
            venv="${RUNNER_TEMP}/smoke-${version}"
            "python${version}" -m venv "${venv}"
            "${venv}/bin/python" -m pip install --quiet "${wheel}[lma,gma]"
            (cd "${RUNNER_TEMP}" && env -u PYTHONPATH -u DAGENTSC_BIN "${venv}/bin/python" -I \
              "${GITHUB_WORKSPACE}/scripts/smoke_installed_package.py" \
              --repo "${GITHUB_WORKSPACE}" --expect-planner bundled)
          done
          venv="${RUNNER_TEMP}/smoke-pure"
          python -m venv "${venv}"
          "${venv}/bin/python" -m pip install --quiet "$(ls "${RUNNER_TEMP}"/pure/*.whl)[lma,gma]"
          (cd "${RUNNER_TEMP}" && env -u PYTHONPATH -u DAGENTSC_BIN "${venv}/bin/python" -I \
            "${GITHUB_WORKSPACE}/scripts/smoke_installed_package.py" \
            --repo "${GITHUB_WORKSPACE}" --expect-planner none)

      - name: Install the wheel without extras and run the smoke test
        # pip install dagents installs pydantic only. The Guard and steps 1 to
        # 4 of the getting-started example must work with it, and
        # dagents-lma and dagents-gma must exit with status 2 and print the
        # pip install command for their extra.
        run: |
          venv="${RUNNER_TEMP}/smoke-no-extras"
          python -m venv "${venv}"
          "${venv}/bin/python" -m pip install --quiet "$(ls "${GITHUB_WORKSPACE}"/dist/*.whl)"
          (cd "${RUNNER_TEMP}" && env -u PYTHONPATH -u DAGENTSC_BIN "${venv}/bin/python" -I \
            "${GITHUB_WORKSPACE}/scripts/smoke_installed_package.py" \
            --repo "${GITHUB_WORKSPACE}" --expect-planner bundled --no-extras)

      - name: Install the wheel next to openai-agents and run the smoke test
        # openai-agents installs a top-level module named agents, the old name
        # of this package. The package was renamed so that both install into
        # one environment, so this step installs both and runs the smoke test
        # there. The smoke test reads only the files the dagents distribution
        # installed, and --agents-from checks that agents comes from
        # openai-agents and imports next to dagents.
        run: |
          venv="${RUNNER_TEMP}/smoke-openai-agents"
          python3.13 -m venv "${venv}"
          "${venv}/bin/python" -m pip install --quiet "$(ls "${GITHUB_WORKSPACE}"/dist/*.whl)[lma,gma]" openai-agents==0.24.0
          "${venv}/bin/python" -m pip check
          (cd "${RUNNER_TEMP}" && env -u PYTHONPATH -u DAGENTSC_BIN "${venv}/bin/python" -I \
            "${GITHUB_WORKSPACE}/scripts/smoke_installed_package.py" \
            --repo "${GITHUB_WORKSPACE}" --expect-planner bundled --agents-from openai-agents)

      - name: Run the agent suite on the newest versions the extras allow
        # The agents job pins FastAPI 0.115.0 and uvicorn 0.30.6, the lowest
        # versions the lma and gma extras accept. pip gives a user the newest
        # versions instead, so this step installs the wheel with all its
        # extras (the agents job installs psycopg, matplotlib and PyYAML too)
        # on the newest Python the classifiers list, removes the package
        # itself, and runs the suite from the checkout against those versions.
        env:
          DAGENTSC_BIN: ${{ env.PLANNER_DIR }}/dagentsc-linux-x86_64
        run: |
          set -o pipefail
          venv="${RUNNER_TEMP}/newest"
          python3.13 -m venv "${venv}"
          "${venv}/bin/python" -m pip install --quiet "$(ls dist/*.whl)[all]"
          "${venv}/bin/python" -m pip uninstall --yes --quiet dagents
          "${venv}/bin/python" -c "import fastapi, starlette, uvicorn, pydantic; print('fastapi', fastapi.__version__, '| starlette', starlette.__version__, '| uvicorn', uvicorn.__version__, '| pydantic', pydantic.__version__)"
          "${venv}/bin/python" -m unittest discover -s dagents/tests -t . -v 2>&1 | tee newest-suite.log
          python scripts/ci_no_skipped_tests.py \
            --forbid planner \
            --forbid charts \
            --require-ran dagents.tests.test_agent_api.TokenScopeTests \
            --require-ran dagents.tests.test_agent_api.RoutePairConventionTests \
            --require-ran dagents.tests.test_gma_http_engine.RouteTokenTests \
            --require-ran dagents.tests.test_agent_network_flow.OverHttpStudyTests \
            newest-suite.log

  # ---------------------------------------------------------------------------
  # One check to require on the branch, so adding a job above does not mean
  # editing branch protection.
  # ---------------------------------------------------------------------------
  ci:
    name: CI
    runs-on: ubuntu-latest
    if: always()
    needs:
      - planners
      - agents
      - framework-services
      - contracts
      - spring
      - demo-apps
      - frontends
      - deploy-smoke
      - packaging
      - docs-impact
    steps:
      - name: Report the outcome
        # docs-impact is skipped on a manual run; a skipped job does not fail
        # the gate.
        env:
          DOCS_IMPACT: ${{ needs.docs-impact.result }}
          PACKAGING: ${{ needs.packaging.result }}
        run: |
          echo "planners:           ${{ needs.planners.result }}"
          echo "agents:             ${{ needs.agents.result }}"
          echo "framework-services: ${{ needs.framework-services.result }}"
          echo "contracts:          ${{ needs.contracts.result }}"
          echo "spring:             ${{ needs.spring.result }}"
          echo "demo-apps:          ${{ needs.demo-apps.result }}"
          echo "frontends:          ${{ needs.frontends.result }}"
          echo "deploy-smoke:       ${{ needs.deploy-smoke.result }}"
          echo "packaging:          ${PACKAGING}"
          echo "docs-impact:        ${DOCS_IMPACT}"
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "::error::At least one CI job did not succeed."
            exit 1
          fi
