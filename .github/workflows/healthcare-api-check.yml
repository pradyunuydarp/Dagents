name: Healthcare API check

# Asks the deployed healthcare API what it is doing, from somewhere that can
# reach it.
#
# This exists because the question comes up constantly and cannot be answered
# from a development container: the agent sandbox has no route to the host, and
# the Pages gate only reports pass or fail. When the published demo falls back
# to its recording, this says which of the handful of reasons it was — the
# service was never deployed, it is asleep, it is crash-looping, it is up but
# generating its own cohorts, or it will not accept browser requests from the
# published page.
#
# It reads nothing secret and prints nothing secret. The address comes from
# `env/.env.published`, which is committed because it is a published URL.

on:
  workflow_dispatch:
    inputs:
      api:
        description: "API base to probe (default: the one in env/.env.published)"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  probe:
    name: Probe the deployed API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the address
        env:
          # Through `env:`, not `${{ }}`: a dispatch input interpolated into a
          # script is shell supplied by whoever pressed the button.
          OVERRIDE: ${{ inputs.api }}
        run: |
          set -euo pipefail
          resolved="${OVERRIDE}"
          if [ -z "${resolved}" ]; then
            resolved=$(sed -n 's/^HEALTHCARE_DEMO_PUBLIC_API_URL=//p' env/.env.published | tail -1)
          fi
          case "${resolved}" in
            https://*) ;;
            *)
              echo "::error::'${resolved}' is not an https URL."
              exit 1
              ;;
          esac
          echo "API=${resolved}" >> "$GITHUB_ENV"
          echo "probing ${resolved}"

      - name: Is it answering at all
        env:
          API: ${{ env.API }}
        run: |
          set -uo pipefail
          # No retry loop here, on purpose: this is a diagnosis, and the first
          # response is the one that says what state the service is in. The
          # Pages gate is the place that waits out a cold start.
          #
          # Headers to their own file and stderr to another, so `-w` is the only
          # thing on stdout: mixing curl's error text into the same capture
          # makes `tail -1` a race between the status code and the message.
          code=$(curl -sS -o /tmp/body -D /tmp/headers -w '%{http_code}' --max-time 45 \
                   "${API}/api/v1/health" 2>/tmp/curl-err) || true
          echo "status: ${code:-<no response>}"
          if [ -s /tmp/curl-err ]; then
            echo "--- curl said ---"
            cat /tmp/curl-err
          fi
          echo "--- response headers of interest ---"
          tr -d '\r' < /tmp/headers \
            | grep -iE '^(server|x-render-routing|rndr-id|retry-after|content-type|access-control-allow-origin):' \
            || echo "(none of the usual ones were sent)"
          echo "--- first 300 bytes of body ---"
          head -c 300 /tmp/body 2>/dev/null || true
          echo

          # Render's own routing header is the fastest way to tell these apart,
          # and the reason this job prints headers rather than just a code.
          routing=$(tr -d '\r' < /tmp/headers \
                      | sed -n 's/^[Xx]-[Rr]ender-[Rr]outing: //p' | tail -1)
          case "${routing}" in
            no-server)
              echo "::error::Render says no-server: nothing is deployed at this address. Either" \
                   "the blueprint was never applied, the first build failed, or the service was" \
                   "suspended or deleted. Check the service's Events and Logs tabs."
              ;;
            hibernate*|suspend*)
              echo "::error::Render says the service is suspended or hibernating (${routing})." \
                   "A free instance that exceeded its monthly hours stays down until the quota" \
                   "resets or the plan changes."
              ;;
            dynamic|"")
              : # routed to the service; the status code below is the story
              ;;
            *)
              echo "::notice::x-render-routing: ${routing}"
              ;;
          esac

          echo "HEALTH_CODE=${code}" >> "$GITHUB_ENV"
          [ "${code}" = "200" ] || {
            echo "::error::${API} is not serving. Everything below is skipped."
            exit 1
          }

      - name: What it says about itself
        if: ${{ env.HEALTH_CODE == '200' }}
        env:
          API: ${{ env.API }}
        run: |
          set -uo pipefail
          # Fetched once and reused: asking twice could print two different
          # answers and would make the report self-contradicting.
          #
          # The status code is captured, not discarded. An earlier version of
          # this step read the body and ignored the code, so a 503 saying "the
          # database cannot be read" was reported as the service describing
          # itself normally — a diagnostic that hid the fault it exists to find.
          status_code=$(curl -sS -o /tmp/status.json -w '%{http_code}' --max-time 45 \
                          "${API}/api/v1/framework/status" || echo 000)
          overview_code=$(curl -sS -o /tmp/overview.json -w '%{http_code}' --max-time 45 \
                            "${API}/api/v1/overview" || echo 000)
          echo "status: ${status_code}   overview: ${overview_code}"

          STATUS_CODE="${status_code}" OVERVIEW_CODE="${overview_code}" python3 - <<'PY'
          import json
          import os


          def body(path):
              try:
                  with open(path) as handle:
                      return json.load(handle)
              except Exception as exc:
                  return {"detail": f"the response was not JSON: {exc}"}


          status = body("/tmp/status.json")
          overview = body("/tmp/overview.json")
          status_code = os.environ["STATUS_CODE"]
          overview_code = os.environ["OVERVIEW_CODE"]
          source = status.get("cohort_source")
          origins = status.get("allowed_origins", "not reported")
          failed = [code for code in (status_code, overview_code) if not code.startswith("2")]

          print(f"--- /api/v1/framework/status ({status_code}) ---")
          print("cohort_source     :", source)
          print("records synthetic :", status.get("records_are_synthetic"))
          print("allowed origins   :", origins)
          for service in status.get("services", []):
              print(f"  {service['name']:22} {service['status']}")
          if status.get("detail"):
              # The 503 carries the driver's own words, which is the whole
              # reason that endpoint answers at all when the store is down.
              print("detail            :", status["detail"])

          print(f"--- /api/v1/overview ({overview_code}) ---")
          print("study             :", overview.get("study_id"))
          for hospital in overview.get("hospitals", []):
              print(f"  {hospital['site_id']:22} cohort {hospital['cohort_size']}")
          if overview.get("detail"):
              print("detail            :", overview["detail"])

          # A notice as well as the log. Annotations are the one part of a
          # finished run that can be read back in a single cheap request, which
          # is what matters when the thing being diagnosed is a service that
          # whoever is debugging cannot reach directly.
          print(f"::notice::cohort_source={source} allowed_origins={origins}")

          if status.get("detail"):
              print(f"::error::The encounter store could not be read: {status['detail']}")
          elif source == "synthetic":
              print(
                  "::error::This API is generating its cohorts in process rather than reading "
                  "the encounter store, so the published demo falls back to its recording. Set "
                  "HEALTHCARE_DEMO_DATABASE_URL on the service to the Supabase pooler URL."
              )
          # Only a *healthy* status response that omits the field says anything
          # about the image's age. An error body omits it too, and reading that
          # as "an old build" sends the next person to redeploy a service whose
          # code was never the problem.
          if origins == "not reported" and status_code.startswith("2"):
              print(
                  "::notice::This build predates the allowed_origins field, so the service is "
                  "running an older image than the repository. Render → Manual Deploy → Deploy "
                  "latest commit."
              )

          if failed:
              raise SystemExit(
                  f"The API answered {', '.join(failed)} rather than 2xx. It is running, but it "
                  "cannot serve the demo in this state."
              )
          PY

      - uses: actions/setup-python@v5
        if: ${{ !cancelled() && env.HEALTH_CODE == '200' }}
        with:
          python-version: "3.11"

      - name: Install what the deployed-service tests need
        # Only httpx. These tests talk to the deployment over HTTP and import
        # nothing from the app, so there is no reason to build the app's whole
        # environment — this is a diagnostic that gets run repeatedly and should
        # stay quick.
        if: ${{ !cancelled() && env.HEALTH_CODE == '200' }}
        run: python -m pip install "httpx<1"

      - name: Exercise the deployed services
        # The checks above establish that the service is reachable and reading
        # the right store. These exercise what the demo actually does — the
        # guard's levers, the cohort floor, a full governed pilot, the audit
        # chains — against the deployment rather than a local process. Every
        # fault this deployment has had was invisible to the local suite and
        # obvious within one request to the running service.
        if: ${{ !cancelled() && env.HEALTH_CODE == '200' }}
        env:
          HEALTHCARE_DEPLOYED_API: ${{ env.API }}
        working-directory: apps/healthcare-demo
        run: |
          set -o pipefail
          # Failures are re-emitted as annotations. unittest writes them to the
          # log, and a log is the expensive part of a finished run to read back;
          # whoever is diagnosing a deployment they cannot reach should get the
          # assertion in the one cheap request, not four hundred lines around it.
          if python -m unittest discover -s tests -t . -p "test_deployed_api.py" -v 2>&1 \
               | tee /tmp/deployed-tests.log; then
            exit 0
          fi
          python3 - <<'PY'
          import re

          log = open("/tmp/deployed-tests.log", encoding="utf-8", errors="replace").read()
          # Each block starts at a FAIL:/ERROR: header and runs to the next rule.
          for block in re.split(r"={20,}", log):
              header = re.search(r"^(FAIL|ERROR): (\S+)", block.strip(), re.MULTILINE)
              if not header:
                  continue
              reason = [
                  line.strip()
                  for line in block.splitlines()
                  if line.startswith(("AssertionError", "httpx.", "KeyError", "TypeError"))
                  or " : " in line.strip()[:0]
              ]
              detail = reason[-1] if reason else "see the log for the traceback"
              name = header.group(2).rsplit(".", 1)[-1]
              print(f"::error::{header.group(1)} {name}: {detail[:800]}")
          PY
          exit 1

      - name: Will a browser be allowed to call it
        # Runs even when the step above failed: a store that cannot be read and
        # an origin that is refused are independent faults, and finding one
        # should not hide the other. Only a cancelled run skips it.
        if: ${{ !cancelled() && env.HEALTH_CODE == '200' }}
        env:
          API: ${{ env.API }}
          ORIGIN: https://${{ github.repository_owner }}.github.io
        run: |
          set -uo pipefail
          # With an Origin header, because without one this is not the request a
          # browser makes and a blocked API looks perfectly healthy.
          allow=$(curl -sS -o /dev/null -D - --max-time 45 -H "Origin: ${ORIGIN}" \
                    "${API}/api/v1/health" | tr -d '\r' \
                  | sed -n 's/^[Aa]ccess-[Cc]ontrol-[Aa]llow-[Oo]rigin: //p' | tail -1)
          echo "Access-Control-Allow-Origin for ${ORIGIN}: ${allow:-<absent>}"

          # What the service says it will accept, so the failure names the
          # actual configured value rather than only the missing header. An
          # annotation is the cheapest thing to read back from a finished run,
          # so the diagnosis belongs in it and not only in the log.
          configured=$(curl -sS --max-time 45 "${API}/api/v1/framework/status" \
                       | python3 -c "import json,sys; print(json.load(sys.stdin).get('allowed_origins', 'not reported'))" \
                       || echo "could not be read")
          echo "the service reports it allows: ${configured}"

          case "${allow}" in
            "*" | "${ORIGIN}")
              echo "a browser on ${ORIGIN} may call this API"
              ;;
            *)
              echo "::error::Every request from the published page would be blocked by the" \
                   "browser. Asked as ${ORIGIN}, the API sent Access-Control-Allow-Origin:" \
                   "${allow:-<absent>}, and reports its allowed origins as ${configured}." \
                   "Set HEALTHCARE_DEMO_CORS_ORIGINS on the service to ${ORIGIN} exactly" \
                   "(an origin, with no path), or unset it to allow any origin."
              exit 1
              ;;
          esac
