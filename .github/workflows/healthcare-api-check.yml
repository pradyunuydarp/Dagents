name: Healthcare API check

# Asks the deployed healthcare API what it is doing, from somewhere that can
# reach it.
#
# This exists because the question comes up constantly and cannot be answered
# from a development container: the agent sandbox has no route to the host, and
# the Pages gate only reports pass or fail. When the published demo falls back
# to its recording, this says which of the handful of reasons it was — the
# service was never deployed, it is asleep, it is crash-looping, it is up but
# keeps its records in memory instead of Postgres, its database cannot be
# reached, or it will not accept browser requests from the published page.
#
# It writes no hospital data: the deployed-service tests enter no records,
# record no outcomes and approve no model. A manual run also sends the probes
# and a pilot, which add audit records and model versions as a visitor's do.
#
# It also runs every day at 06:41 UTC. The scheduled run is read-only: it sets
# HEALTHCARE_DEPLOYED_API_READ_ONLY, so the tests skip the probes and the
# pilot, and its browser job sends GET requests only. Every run goes red when
# the service sleeps past the page's cold-start budget (the probe's first
# request wakes it and is timed), when its stores are not ready, or when its
# CORS setting stops matching the published page. GitHub turns off the
# schedule of a public repository after 60 days without activity; turn it
# back on with "Enable workflow" on this workflow's page in the Actions tab.
#
# It reads nothing secret and prints nothing secret. The address comes from
# `env/.env.published`, which is committed because it is a published URL.

on:
  schedule:
    # Minute 41, away from the start of the hour, when GitHub delays
    # scheduled runs the most. Daily, in UTC.
    - cron: "41 6 * * *"
  workflow_dispatch:
    inputs:
      api:
        description: "API base to probe (default: the one in env/.env.published). The browser job always opens the published page and warms up the API in env/.env.published."
        type: string
        default: ""

permissions:
  contents: read

jobs:
  probe:
    name: Probe the deployed API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the address
        env:
          # Through `env:`, not `${{ }}`: a dispatch input interpolated into a
          # script is shell supplied by whoever pressed the button.
          OVERRIDE: ${{ inputs.api }}
        run: |
          set -euo pipefail
          resolved="${OVERRIDE}"
          if [ -z "${resolved}" ]; then
            resolved=$(sed -n 's/^HEALTHCARE_DEMO_PUBLIC_API_URL=//p' env/.env.published | tail -1)
          fi
          case "${resolved}" in
            https://*) ;;
            *)
              echo "::error::'${resolved}' is not an https URL."
              exit 1
              ;;
          esac
          echo "API=${resolved}" >> "$GITHUB_ENV"
          echo "probing ${resolved}"

      - name: Is it answering at all
        env:
          API: ${{ env.API }}
        run: |
          set -uo pipefail
          # No retry loop here, on purpose: this is a diagnosis, and the first
          # response is the one that says what state the service is in. The
          # Pages gate is the place that waits out a cold start.
          #
          # Headers to their own file and stderr to another, so `-w` is the only
          # thing on stdout: mixing curl's error text into the same capture
          # makes `tail -1` a race between the status code and the message.
          # Timed, because this is the only place the wake can be measured: by
          # the request that does the waking. A container that sleeps when idle
          # takes as long to start as its image takes to load, and if that
          # exceeds what the published page waits out, whoever arrives first
          # sees an error. So a wake longer than the page's budget fails this
          # step. The steps below still run, because the service is up. The
          # browser job runs after this job and finds the service awake, so it
          # cannot time the wake. The number is also reported as an annotation
          # so it can be read back from a finished run without opening the log.
          #
          # The budget is read from the page's transport, so the two cannot differ.
          budget_ms=$(sed -n 's/.*COLD_START_BUDGET_MS *= *\([0-9_]*\).*/\1/p' \
                        apps/healthcare-demo/frontend/src/api.ts | head -1 | tr -d _)
          if [ -z "${budget_ms}" ]; then
            echo "::error::apps/healthcare-demo/frontend/src/api.ts no longer defines COLD_START_BUDGET_MS."
            exit 1
          fi
          budget=$(( budget_ms / 1000 ))
          started=$(date +%s)
          code=$(curl -sS -o /tmp/body -D /tmp/headers -w '%{http_code}' --max-time "$(( budget + 30 ))" \
                   "${API}/api/v1/health" 2>/tmp/curl-err) || true
          elapsed=$(( $(date +%s) - started ))
          echo "status: ${code:-<no response>}   after ${elapsed}s"
          if [ "${code}" = "200" ]; then
            if [ "${elapsed}" -gt "${budget}" ]; then
              echo "::error::Cold start: the first request took ${elapsed}s, and the published page" \
                   "waits ${budget}s, so a visitor who arrives while the service sleeps sees an error."
            elif [ "${elapsed}" -gt 5 ]; then
              echo "::notice::Cold start: the first request took ${elapsed}s. The published page" \
                   "waits ${budget}s, so a visitor arriving at a sleeping service recovers as long as" \
                   "this stays under that."
            else
              echo "::notice::The service was already awake (first request ${elapsed}s)."
            fi
          fi
          if [ -s /tmp/curl-err ]; then
            echo "--- curl said ---"
            cat /tmp/curl-err
          fi
          echo "--- response headers of interest ---"
          tr -d '\r' < /tmp/headers \
            | grep -iE '^(server|x-render-routing|rndr-id|retry-after|content-type|access-control-allow-origin):' \
            || echo "(none of the usual ones were sent)"
          echo "--- first 300 bytes of body ---"
          head -c 300 /tmp/body 2>/dev/null || true
          echo

          # Render's own routing header is the fastest way to tell these apart,
          # and the reason this job prints headers rather than just a code.
          routing=$(tr -d '\r' < /tmp/headers \
                      | sed -n 's/^[Xx]-[Rr]ender-[Rr]outing: //p' | tail -1)
          case "${routing}" in
            no-server)
              echo "::error::Render says no-server: nothing is deployed at this address. Either" \
                   "the blueprint was never applied, the first build failed, or the service was" \
                   "suspended or deleted. Check the service's Events and Logs tabs."
              ;;
            hibernate*|suspend*)
              echo "::error::Render says the service is suspended or hibernating (${routing})." \
                   "A free instance that exceeded its monthly hours stays down until the quota" \
                   "resets or the plan changes."
              ;;
            dynamic|"")
              : # routed to the service; the status code below is the story
              ;;
            *)
              echo "::notice::x-render-routing: ${routing}"
              ;;
          esac

          echo "HEALTH_CODE=${code}" >> "$GITHUB_ENV"
          [ "${code}" = "200" ] || {
            echo "::error::${API} is not serving. Everything below is skipped."
            exit 1
          }
          # A slow wake fails the run, but the service answered, so the steps
          # below still describe it.
          [ "${elapsed}" -le "${budget}" ]

      - name: What it says about itself
        # `!cancelled()`, so it also runs after a wake longer than the page's
        # budget failed the step above.
        if: ${{ !cancelled() && env.HEALTH_CODE == '200' }}
        env:
          API: ${{ env.API }}
        run: |
          set -uo pipefail
          # Fetched once and reused: asking twice could print two different
          # answers and would make the report self-contradicting.
          #
          # The status code is captured, not discarded. An earlier version of
          # this step read the body and ignored the code, so a 503 saying "the
          # database cannot be read" was reported as the service describing
          # itself normally — a diagnostic that hid the fault it exists to find.
          status_code=$(curl -sS -o /tmp/status.json -w '%{http_code}' --max-time 45 \
                          "${API}/api/v1/framework/status" || echo 000)
          overview_code=$(curl -sS -o /tmp/overview.json -w '%{http_code}' --max-time 45 \
                            "${API}/api/v1/overview" || echo 000)
          echo "status: ${status_code}   overview: ${overview_code}"

          STATUS_CODE="${status_code}" OVERVIEW_CODE="${overview_code}" python3 - <<'PY'
          import json
          import os


          def body(path):
              try:
                  with open(path) as handle:
                      return json.load(handle)
              except Exception as exc:
                  return {"detail": f"the response was not JSON: {exc}"}


          status = body("/tmp/status.json")
          overview = body("/tmp/overview.json")
          status_code = os.environ["STATUS_CODE"]
          overview_code = os.environ["OVERVIEW_CODE"]
          source = status.get("cohort_source")
          layout = status.get("store_layout", "not reported")
          ready = status.get("ready", "not reported")
          origins = status.get("allowed_origins", "not reported")
          failed = [code for code in (status_code, overview_code) if not code.startswith("2")]

          print(f"--- /api/v1/framework/status ({status_code}) ---")
          print("cohort_source     :", source)
          print("store_layout      :", layout)
          print("ready             :", ready)
          if "hospitals" in status:
              if status["hospitals"] is None:
                  print("  the API could not read the hospital stores")
              for row in status["hospitals"] or []:
                  print(f"  {row['site_id']:10} records {row.get('record_count')}, labelled {row.get('labelled_count')}")
          print("dataset           :", (status.get("dataset") or {}).get("name"))
          print("allowed origins   :", origins)
          for service in status.get("services", []):
              print(f"  {service['name']:22} {service['status']}")
          if status.get("detail"):
              print("detail            :", status["detail"])

          print(f"--- /api/v1/overview ({overview_code}) ---")
          print("study             :", overview.get("study_id"))
          print("model in use      :", (overview.get("current_model") or {}).get("version"))
          for hospital in overview.get("hospitals", []):
              store = hospital.get("store") or {}
              print(
                  f"  {hospital['site_id']:10} records {hospital.get('record_count')}"
                  f" (entered {hospital.get('entered_count')}, labelled {hospital.get('labelled_count')})"
                  f"  store {store.get('kind')} {store.get('schema', '')}"
              )
          if overview.get("detail"):
              print("detail            :", overview["detail"])

          # A notice as well as the log. Annotations are the one part of a
          # finished run that can be read back in a single cheap request.
          print(f"::notice::cohort_source={source} store_layout={layout} ready={ready} allowed_origins={origins}")

          if overview_code == "503" or status_code == "503":
              # The API's 503 message is plain on purpose; the database error
              # (host, user, driver text) is in the service's own log.
              print(
                  "::error::The API cannot reach its Postgres stores. Read the service's log on "
                  "Render for the database error, and check HEALTHCARE_DEMO_DATABASE_URL."
              )
          elif source == "in-memory":
              print(
                  "::error::This API keeps its records in memory instead of Postgres, so the "
                  "published demo falls back to its recording. Set HEALTHCARE_DEMO_DATABASE_URL "
                  "on the service to the Supabase pooler URL."
              )
          elif source != "postgres" and status_code.startswith("2"):
              print(f"::error::The API reports cohort_source={source}; the published demo needs postgres.")
          elif ready is False and status.get("hospitals") is None:
              print(
                  "::error::The API cannot read the hospital stores, so the published demo falls back "
                  "to its recording. The database may not be migrated for this version: run Actions → "
                  "Healthcare data. The database error is in the service's log on Render."
              )
          elif ready is False:
              empty = [row["site_id"] for row in status.get("hospitals") or [] if not row.get("record_count")]
              print(
                  f"::error::These hospital stores hold no records: {', '.join(empty) or 'none listed'}. "
                  "The published demo falls back to its recording until every store has records. "
                  "Run Actions → Healthcare data with seed on."
              )
          # Only a healthy status response that omits the field says anything
          # about the image's age. An error body omits it too.
          if layout == "not reported" and status_code.startswith("2"):
              print(
                  "::notice::This build predates the store_layout field, so the service is "
                  "running an older image than the repository. Render → Manual Deploy → Deploy "
                  "latest commit."
              )

          if failed:
              raise SystemExit(
                  f"The API answered {', '.join(failed)} rather than 2xx. It is running, but it "
                  "cannot serve the demo in this state."
              )
          if ready is False:
              raise SystemExit(
                  "The API reports that its hospital stores are not ready, so it cannot serve the "
                  "demo yet. The error annotation above names the cause."
              )
          PY

      - uses: actions/setup-python@v5
        if: ${{ !cancelled() && env.HEALTH_CODE == '200' }}
        with:
          python-version: "3.11"

      - name: Install what the deployed-service tests need
        # Only httpx. These tests talk to the deployment over HTTP and import
        # nothing from the app, so there is no reason to build the app's whole
        # environment — this is a diagnostic that gets run repeatedly and should
        # stay quick.
        if: ${{ !cancelled() && env.HEALTH_CODE == '200' }}
        run: python -m pip install "httpx<1"

      - name: Exercise the deployed services
        # The checks above show that the service is reachable and reading
        # Postgres. These test what the demo does against the deployment: the
        # Guard's controls, the cohort floor, a pilot whose decision matches its
        # gates, the audit chains and the charts. They enter no records and
        # approve nothing. Every fault this deployment has had passed the local
        # suite and showed up on the first request to the running service.
        #
        # The scheduled run sets HEALTHCARE_DEPLOYED_API_READ_ONLY, so the five
        # tests that send a probe or run a pilot skip and the daily run adds
        # nothing to the public demo. A manual run runs them all.
        if: ${{ !cancelled() && env.HEALTH_CODE == '200' }}
        env:
          HEALTHCARE_DEPLOYED_API: ${{ env.API }}
          HEALTHCARE_DEPLOYED_API_READ_ONLY: ${{ github.event_name == 'schedule' && '1' || '' }}
        working-directory: apps/healthcare-demo
        run: |
          set -o pipefail
          # Failures are re-emitted as annotations. unittest writes them to the
          # log, and a log is the expensive part of a finished run to read back;
          # whoever is diagnosing a deployment they cannot reach should get the
          # assertion in the one cheap request, not four hundred lines around it.
          if python -m unittest discover -s tests -t . -p "test_deployed_api.py" -v 2>&1 \
               | tee /tmp/deployed-tests.log; then
            exit 0
          fi
          python3 - <<'PY'
          import re

          log = open("/tmp/deployed-tests.log", encoding="utf-8", errors="replace").read()
          # Each block starts at a FAIL:/ERROR: header and runs to the next rule.
          for block in re.split(r"={20,}", log):
              header = re.search(r"^(FAIL|ERROR): (\S+)", block.strip(), re.MULTILINE)
              if not header:
                  continue
              reason = [
                  line.strip()
                  for line in block.splitlines()
                  if line.startswith(("AssertionError", "httpx.", "KeyError", "TypeError"))
                  or " : " in line.strip()[:0]
              ]
              detail = reason[-1] if reason else "see the log for the traceback"
              name = header.group(2).rsplit(".", 1)[-1]
              print(f"::error::{header.group(1)} {name}: {detail[:800]}")
          PY
          exit 1

      - name: Will a browser be allowed to call it
        # Runs even when the step above failed: a store that cannot be read and
        # an origin that is refused are independent faults, and finding one
        # should not hide the other. Only a cancelled run skips it.
        if: ${{ !cancelled() && env.HEALTH_CODE == '200' }}
        env:
          API: ${{ env.API }}
          ORIGIN: https://${{ github.repository_owner }}.github.io
        run: |
          set -uo pipefail
          # With an Origin header, because without one this is not the request a
          # browser makes and a blocked API looks perfectly healthy.
          allow=$(curl -sS -o /dev/null -D - --max-time 45 -H "Origin: ${ORIGIN}" \
                    "${API}/api/v1/health" | tr -d '\r' \
                  | sed -n 's/^[Aa]ccess-[Cc]ontrol-[Aa]llow-[Oo]rigin: //p' | tail -1)
          echo "Access-Control-Allow-Origin for ${ORIGIN}: ${allow:-<absent>}"

          # What the service says it will accept, so the failure names the
          # actual configured value rather than only the missing header. An
          # annotation is the cheapest thing to read back from a finished run,
          # so the diagnosis belongs in it and not only in the log.
          configured=$(curl -sS --max-time 45 "${API}/api/v1/framework/status" \
                       | python3 -c "import json,sys; print(json.load(sys.stdin).get('allowed_origins', 'not reported'))" \
                       || echo "could not be read")
          echo "the service reports it allows: ${configured}"

          case "${allow}" in
            "*" | "${ORIGIN}")
              echo "a browser on ${ORIGIN} may call this API"
              ;;
            *)
              echo "::error::Every request from the published page would be blocked by the" \
                   "browser. Asked as ${ORIGIN}, the API sent Access-Control-Allow-Origin:" \
                   "${allow:-<absent>}, and reports its allowed origins as ${configured}." \
                   "Set HEALTHCARE_DEMO_CORS_ORIGINS on the service to ${ORIGIN} exactly" \
                   "(an origin, with no path), or unset it to allow any origin."
              exit 1
              ;;
          esac

  page:
    name: Open the published stroke demo in a browser
    runs-on: ubuntu-latest
    # After the probe, so the probe's first request is the run's first request
    # and the one that times a wake. After it even when it failed: the probe
    # asks the API with curl, and this asks it as the published page does,
    # from the Pages origin. They find different faults, so one should not
    # hide the other.
    needs: probe
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install the browser driver
        working-directory: site
        run: npm ci

      - name: The published stroke demo reads the API in a browser
        # scripts/check_published_pages.mjs opens the published stroke demo in
        # Chrome and fails unless it is a live build that loads the consortium
        # within the page's cold-start budget, reports records in Postgres and
        # every store ready, lists 3 or more hospitals, draws a hospital's
        # charts and says the agents run in process. With --warm-up it first
        # sends one GET to the health route of the API named in
        # env/.env.published, so an API that does not answer is reported apart
        # from a broken page. The probe job has woken the service by then; the
        # probe's first request is the one timed against the budget. Any
        # request other than GET, HEAD or OPTIONS is stopped in the browser and
        # fails the step. If the published page is a replay, the last Pages
        # build found the API unavailable, and this step fails and says so.
        env:
          HEALTHCARE_MODE: live
          CHROMIUM_PATH: /usr/bin/google-chrome
        run: node scripts/check_published_pages.mjs --only healthcare --api-problems fail --wait 60 --warm-up
