name: Pages

# Publishes three sites as one tree:
#
#   /                  the framework site — documentation, the generated API
#                      reference, and links to the demos
#   /healthcare-demo/  the stroke-triage demo
#   /nl2sql-demo/      the natural-language-to-SQL demo
#
# Neither demo publishes a dead page or a faked one, by two different routes.
#
# The healthcare demo has a deployed API, so it is published pointing at it:
# the address is resolved from `env/.env.published`, the API is probed here, and
# the page reads live rows out of the encounter store. If that API cannot be
# woken this workflow falls back to the capture and says so, because the
# alternative is a page whose every panel is an error.
#
# NL2SQL has no deployed backend, so it replays. This workflow builds the OCaml
# planner, starts the real backends against it, records what every request the
# UI can make actually returns, and ships that capture with the bundle. The page
# names the commit it was captured from, and refuses anything the capture does
# not hold rather than inventing an answer.
#
# That ordering is load-bearing: capture writes into each frontend's `public/`,
# which Vite copies into `dist/`, so the capture has to finish before the build.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and never cancel one mid-flight: a cancelled deployment
# can leave the Pages site on a half-published tree.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the published tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # First, so the builds can be told the base path this site is served from
      # rather than hardcoding the repository name.
      #
      # `enablement` asks the API to turn Pages on, but the workflow token is
      # only allowed to deploy to an existing Pages site, not to create one —
      # that needs a repository admin to set Settings → Pages → Build and
      # deployment → Source to "GitHub Actions", once. Until then this step
      # fails, so it is allowed to: everything after it is worth running and
      # checking regardless, and the deploy job is where the absence actually
      # bites.
      - name: Configure Pages
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Resolve the base path
        # Whether Pages answered is the question, not whether the answer is
        # non-empty: a site on a custom domain is served from the root, so its
        # base path is legitimately empty. Testing for emptiness would mistake
        # that for "Pages is off" and rewrite every asset URL to
        # /<repository>/…, which 404s on the custom domain — the failure would
        # appear only after someone pointed a domain at this, and would look
        # like a DNS problem.
        #
        # Every repository variable reaches this script through `env:` rather
        # than `${{ }}`. Anyone who can set a variable could otherwise set it to
        # shell, and it would run here with the workflow's token.
        env:
          PAGES_OUTCOME: ${{ steps.pages.outcome }}
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
          CUSTOM_DOMAIN: ${{ vars.PAGES_CUSTOM_DOMAIN }}
          REPOSITORY_NAME: ${{ github.event.repository.name }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          if [ "${PAGES_OUTCOME}" = "success" ]; then
            resolved="${PAGES_BASE_PATH}"
            echo "Pages reports base_url=${PAGES_BASE_URL}"
            origin=$(printf '%s' "${PAGES_BASE_URL}" | sed -E 's#^(https?://[^/]+).*#\1#')
          else
            resolved="/${REPOSITORY_NAME}"
            origin="https://${REPOSITORY_OWNER}.github.io"
            echo "::warning::Pages is not enabled for this repository yet, so the base path was" \
                 "derived as ${resolved}. A repository admin enables it under" \
                 "Settings → Pages → Build and deployment → Source: GitHub Actions."
          fi
          # A custom domain wins: that is where the browser will be when it
          # calls the API, which is what the CORS check below has to ask about.
          if [ -n "${CUSTOM_DOMAIN}" ]; then
            origin="https://${CUSTOM_DOMAIN}"
          fi
          echo "BASE_PATH=${resolved}" >> "$GITHUB_ENV"
          echo "PAGES_ORIGIN=${origin}" >> "$GITHUB_ENV"
          echo "Serving from ${origin}${resolved:-}/"

      # --- the planner ----------------------------------------------------
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.1"
          dune-cache: true
          opam-pin: false

      - name: Install OCaml dependencies
        run: opam install --yes dune yojson

      - name: Build dagentsc
        working-directory: bindings/ocaml
        run: opam exec -- dune build ./bin/dagentsc.exe

      # --- the backends the capture drives --------------------------------
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            agents/*/requirements.txt
            services/*/requirements.txt
            services/nl2sql-demo/backend/requirements.txt
            apps/healthcare-demo/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r agents/lma/requirements.txt \
                                -r agents/gma/requirements.txt \
                                -r services/core-service/requirements.txt \
                                -r services/pipeline-service/requirements.txt \
                                -r services/nl2sql-demo/backend/requirements.txt \
                                -r apps/healthcare-demo/requirements.txt

      - name: Install model-service dependencies
        # Optional: it is the one service that needs torch, and the CPU wheel is
        # still a large download. The capture treats it as optional and records
        # it as unavailable if it is not running, which is the truth of that
        # capture rather than a hidden failure.
        continue-on-error: true
        run: |
          python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu \
            -r services/model-service/requirements.txt

      - name: Capture real backend responses
        env:
          DAGENTSC_BIN: ${{ github.workspace }}/bindings/ocaml/_build/default/bin/dagentsc.exe
        run: python scripts/capture_demo_recordings.py --demo all

      - name: Check the captures are usable
        # A capture that produced no guard denials, or no permits, would mean the
        # levers do nothing in the published demo — worth failing the deploy over,
        # because the page would look fine and prove nothing.
        run: python scripts/check_demo_recordings.py

      # --- the three frontends --------------------------------------------
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            site/package-lock.json
            apps/healthcare-demo/frontend/package-lock.json
            services/nl2sql-demo/frontend/package-lock.json

      - name: The design system is in sync
        run: python scripts/sync_design_system.py --check

      - name: Build the framework site
        env:
          SITE_BASE_PATH: ${{ env.BASE_PATH }}/
        working-directory: site
        run: |
          npm ci
          npm run build

      - name: Resolve the deployed healthcare API
        # The published demo calls a real backend instead of replaying its
        # capture, so the build has to be told where that backend is. The
        # address is a published URL — it ends up in the page source, readable
        # by anyone who opens the demo — so it is configuration, not a
        # credential, and it lives in `env/.env.published` where there is one
        # copy of it. A `HEALTHCARE_API_BASE` repository variable overrides the
        # file without a commit, which is how a branch gets pointed at a
        # staging API.
        env:
          OVERRIDE: ${{ vars.HEALTHCARE_API_BASE }}
        run: |
          set -euo pipefail
          resolved=$(sed -n 's/^HEALTHCARE_DEMO_PUBLIC_API_URL=//p' env/.env.published | tail -1)
          source="env/.env.published"

          if [ -n "${OVERRIDE}" ]; then
            # An override carrying a query string or credentials is refused and
            # never echoed. Pasting a deploy hook in here instead of the service
            # URL is an easy mistake with two costs: every request the published
            # page made would be rejected, and because repository variables are
            # not masked, the key lands in this log in plain text.
            case "${OVERRIDE}" in
              *'?'* | *'@'* | *'api.render.com/sync/'*)
                echo "::warning::The HEALTHCARE_API_BASE repository variable carries a query" \
                     "string or credentials, so it is a deploy hook or a connection string" \
                     "rather than a service URL. It is being ignored in favour of" \
                     "env/.env.published. Delete the variable, and rotate whatever key it" \
                     "holds: repository variables are not masked, so its value has been" \
                     "printed in this run's log."
                {
                  echo "### Ignored the HEALTHCARE_API_BASE variable"
                  echo
                  echo "Its value carries a query string or credentials, which an API base URL"
                  echo "does not. Delete the variable and rotate the key it holds — variables"
                  echo "are not masked in logs."
                } >> "$GITHUB_STEP_SUMMARY"
                ;;
              *)
                resolved="${OVERRIDE}"
                source="the HEALTHCARE_API_BASE repository variable"
                ;;
            esac
          fi

          echo "source: ${source}"
          echo "healthcare API: ${resolved:-<none — the demo will publish as a replay>}"
          echo "HEALTHCARE_API_BASE=${resolved}" >> "$GITHUB_ENV"

      - name: The live API is up and serving the encounter store
        # Four things have to hold before the demo may be published live: the
        # API answers, it reports reading the encounter store, that store has
        # rows, and a browser on this site's origin is allowed to call it. Any
        # one of them failing clears the address, and the demo publishes as a
        # replay instead.
        #
        # None of them fails the deploy, and that is a deliberate reversal of
        # how this started. Failing meant an external service's configuration
        # could stop the framework site and the other demo from publishing at
        # all — a docs change blocked by somebody else's environment variable.
        # And it bought nothing, because the replay is *correct*: the page says
        # it is replaying a capture and names the commit, so nothing is
        # misrepresented either way. What the honesty argument actually demands
        # is that the demo never claims live data it does not have, which
        # clearing the address guarantees.
        #
        # So the loudness lives in the warning and the run summary, and the
        # `Healthcare API check` workflow is the one that fails on demand when
        # someone wants a red mark to chase.
        if: ${{ env.HEALTHCARE_API_BASE != '' }}
        env:
          API: ${{ env.HEALTHCARE_API_BASE }}
          ORIGIN: ${{ env.PAGES_ORIGIN }}
        run: |
          set -uo pipefail

          # Each check appends its reason here. Empty at the end means live.
          reason=""

          # Render's free tier sleeps, so the first request may take ~60s to
          # wake the service. That is a cold start, not a failure.
          echo "waking ${API} ..."
          code=""
          for attempt in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "${API}/api/v1/health" || true)
            [ "$code" = "200" ] && { echo "health 200 after ${attempt} attempt(s)"; break; }
            echo "  attempt ${attempt}: ${code:-no response}"
            sleep 10
          done
          if [ "${code}" != "200" ]; then
            reason="it did not return a healthy response within two minutes (last status: ${code:-no response})"
          fi

          if [ -z "${reason}" ]; then
            source=$(curl -sS --max-time 30 "${API}/api/v1/framework/status" \
                     | python3 -c "import json,sys; print(json.load(sys.stdin).get('cohort_source'))" \
                     || echo "unreadable")
            echo "cohort_source: ${source}"
            if [ "${source}" != "supabase" ]; then
              reason="it reports cohort_source=${source}, so it is generating cohorts in process rather than reading the encounter store"
            fi
          fi

          if [ -z "${reason}" ]; then
            site=$(curl -sS --max-time 30 "${API}/api/v1/overview" \
                   | python3 -c "import json,sys; print(json.load(sys.stdin)['hospitals'][0]['site_id'])" || true)
            rows=$(curl -sS --max-time 30 "${API}/api/v1/hospitals/${site}/worklist?limit=5" \
                   | python3 -c "import json,sys; print(len(json.load(sys.stdin)['worklist']))" || echo 0)
            echo "${site}: ${rows} worklist rows"
            if [ "${rows:-0}" -lt 1 ]; then
              reason="its encounter store returned no rows for ${site}"
            fi
          fi

          if [ -z "${reason}" ]; then
            # The page is on a different origin from the API, so the browser asks
            # permission before it asks for data. Without this header every
            # request is blocked and the demo looks like it is down — the one
            # failure that cannot be seen from a curl that does not send Origin.
            allow=$(curl -sS -o /dev/null -D - --max-time 30 -H "Origin: ${ORIGIN}" \
                      "${API}/api/v1/health" \
                    | tr -d '\r' | sed -n 's/^[Aa]ccess-[Cc]ontrol-[Aa]llow-[Oo]rigin: //p' | tail -1)
            echo "CORS for ${ORIGIN}: ${allow:-<absent>}"
            case "${allow}" in
              "*"|"${ORIGIN}") ;;
              *)
                reason="it does not allow browser requests from ${ORIGIN} (Access-Control-Allow-Origin: ${allow:-absent}), so every request from the published page would be blocked"
                ;;
            esac
          fi

          if [ -n "${reason}" ]; then
            echo "::warning::The healthcare demo is publishing as a replay, not against" \
                 "${API}, because ${reason}. The page says it is a replay, so nothing is" \
                 "misrepresented — but the live data is not live."
            {
              echo "### Healthcare demo: published as a replay, not live"
              echo
              echo "\`${API}\` was not used, because ${reason}."
              echo
              echo "The page ships the recorded capture and says so. Run the"
              echo "**Healthcare API check** workflow for the full diagnosis, fix the service,"
              echo "then re-run this one."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "HEALTHCARE_API_BASE=" >> "$GITHUB_ENV"
          else
            echo "the deployed API is live, reading the encounter store, and callable from ${ORIGIN}"
            {
              echo "### Healthcare demo: published live"
              echo
              echo "Calling \`${API}\`, which reports \`cohort_source: supabase\`."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build the healthcare demo
        env:
          DEMO_BASE_PATH: ${{ env.BASE_PATH }}/healthcare-demo/
          VITE_DAGENTS_STATIC: "1"
          # Resolved above, and cleared again if the API could not be woken, in
          # which case the demo publishes as a replay — the honest default
          # rather than a page pointing at a backend that is not answering.
          VITE_HEALTHCARE_API_BASE: ${{ env.HEALTHCARE_API_BASE }}
        working-directory: apps/healthcare-demo/frontend
        run: |
          npm ci
          npm run build

      - name: Build the NL2SQL demo
        env:
          DEMO_BASE_PATH: ${{ env.BASE_PATH }}/nl2sql-demo/
          VITE_DAGENTS_STATIC: "1"
        working-directory: services/nl2sql-demo/frontend
        run: |
          npm ci
          npm run build

      - name: Assemble the published tree
        env:
          CUSTOM_DOMAIN: ${{ vars.PAGES_CUSTOM_DOMAIN }}
        run: |
          rm -rf _site
          mkdir -p _site
          cp -r site/dist/. _site/
          mkdir -p _site/healthcare-demo _site/nl2sql-demo
          cp -r apps/healthcare-demo/frontend/dist/. _site/healthcare-demo/
          cp -r services/nl2sql-demo/frontend/dist/. _site/nl2sql-demo/
          # Pages serves this tree through Jekyll unless told otherwise, and
          # Jekyll drops paths beginning with an underscore.
          touch _site/.nojekyll
          # A custom domain, when one is configured. Setting it in the Pages UI
          # stores it server-side, but an Actions deployment that ships no CNAME
          # can clear it, so the domain is declared here instead — as a
          # repository variable, so it is configuration rather than a literal
          # buried in a workflow.
          if [ -n "${CUSTOM_DOMAIN}" ]; then
            echo "${CUSTOM_DOMAIN}" > _site/CNAME
            echo "custom domain: ${CUSTOM_DOMAIN}"
          fi
          echo "--- published tree ---"
          find _site -maxdepth 2 -type f | sort | head -40

      - name: Every demo shipped its capture
        # Vite copies `public/` into `dist/`. If that ever stops being true the
        # demos would publish as permanently-loading pages, which is exactly the
        # sort of break a deploy should not sail past.
        run: |
          for demo in healthcare-demo nl2sql-demo; do
            test -s "_site/${demo}/recording.json" || {
              echo "_site/${demo}/recording.json is missing or empty" >&2
              exit 1
            }
            echo "ok  ${demo}/recording.json $(wc -c < "_site/${demo}/recording.json") bytes"
          done

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to Pages
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
