<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="32" height="32" role="img" aria-label="Dagents mark">
  <!-- The light mark drawn for 32 px: thicker lines and larger dots than
       mark.svg, so they stay visible. Rendered to favicon-32.png. -->
  <rect x="0" y="0" width="64" height="64" rx="12" fill="#14181f"/>
  <g stroke="#ffffff" stroke-width="4" stroke-linecap="round">
    <line x1="19" y1="18" x2="45" y2="32"/>
    <line x1="19" y1="32" x2="45" y2="32"/>
    <line x1="19" y1="46" x2="45" y2="32"/>
  </g>
  <g fill="#ffffff">
    <circle cx="19" cy="18" r="5.5"/>
    <circle cx="19" cy="32" r="5.5"/>
    <circle cx="19" cy="46" r="5.5"/>
    <circle cx="45" cy="32" r="9"/>
  </g>
</svg>
