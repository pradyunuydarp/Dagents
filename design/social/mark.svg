<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Dagents mark: three local agents joined to one global agent">
  <!-- The mark for light backgrounds, drawn for 64 px and larger. Colours are
       design system tokens from the light theme: the tile is ds-ink and the
       lines and dots are ds-panel. -->
  <rect x="0" y="0" width="64" height="64" rx="12" fill="#14181f"/>
  <g stroke="#ffffff" stroke-width="3" stroke-linecap="round">
    <line x1="19" y1="18" x2="45" y2="32"/>
    <line x1="19" y1="32" x2="45" y2="32"/>
    <line x1="19" y1="46" x2="45" y2="32"/>
  </g>
  <g fill="#ffffff">
    <circle cx="19" cy="18" r="4.5"/>
    <circle cx="19" cy="32" r="4.5"/>
    <circle cx="19" cy="46" r="4.5"/>
    <circle cx="45" cy="32" r="8"/>
  </g>
</svg>
