<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dagents NL2SQL Demo</title>
    <!-- Apply the stored theme before the first paint, so a dark choice does not
         flash light. `ThemeToggle.tsx` owns the choice; this only reads it. -->
    <script>
      try {
        var theme = localStorage.getItem("dagents-theme");
        if (theme === "light" || theme === "dark") document.documentElement.setAttribute("data-theme", theme);
      } catch (error) {}
    </script>
    <meta
      name="description"
      content="A Dagents demo that turns a natural language question into SQL, using the framework's planners and services."
    />
    <!-- Inlined so the page makes no request for it. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230d1015'/%3E%3Cpath d='M8 11l5 5-5 5' fill='none' stroke='%23e8ebf1' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M16 21h8' stroke='%237fa6ff' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <!-- Archivo for text, IBM Plex Mono for values the framework returns. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
