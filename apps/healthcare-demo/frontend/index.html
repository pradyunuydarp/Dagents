<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stroke triage demo</title>
    <!-- Apply the stored theme before the first paint, so a dark choice does not
         flash light. `ThemeToggle.tsx` owns the choice; this only reads it. -->
    <script>
      try {
        var theme = localStorage.getItem("dagents-theme");
        if (theme === "light" || theme === "dark") document.documentElement.setAttribute("data-theme", theme);
      } catch (error) {}
    </script>
    <!-- Archivo for text, IBM Plex Mono for values the framework returns. The
         design system's tokens list fallback fonts, so the page still reads if
         these never load. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <meta name="description" content="A Dagents demo on real International Stroke Trial records. Three hospitals keep their records in separate stores and train a triage model without sharing them." />
    <!-- Link previews on LinkedIn, WhatsApp, Slack and X. Crawlers ignore a
         relative address, so social-meta.mjs replaces the PUBLIC_SITE_URL
         placeholder with the published address at build time. The views live in
         the URL hash, so every view shares these tags. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Dagents" />
    <meta property="og:title" content="Stroke triage demo" />
    <meta property="og:description" content="A Dagents demo on real International Stroke Trial records. Three hospitals keep their records in separate stores and train a triage model without sharing them." />
    <meta property="og:url" content="%PUBLIC_SITE_URL%" />
    <meta property="og:image" content="%PUBLIC_SITE_URL%social-preview.png" />
    <meta property="og:image:secure_url" content="%PUBLIC_SITE_URL%social-preview.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The stroke triage demo card: three hospitals, each with its own database schema that the coordinator has no access to." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Stroke triage demo" />
    <meta name="twitter:description" content="A Dagents demo on real International Stroke Trial records. Three hospitals keep their records in separate stores and train a triage model without sharing them." />
    <meta name="twitter:image" content="%PUBLIC_SITE_URL%social-preview.png" />
    <meta name="twitter:image:alt" content="The stroke triage demo card: three hospitals, each with its own database schema that the coordinator has no access to." />
    <!-- The icons are rendered from design/social/ in the Dagents repository.
         The browser colour is the design system's ds-ground token in each theme. -->
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d1015" media="(prefers-color-scheme: dark)" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
