<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dagents</title>
    <!-- Apply the stored theme before the first paint, so a dark choice does not
         flash light. `ThemeToggle.tsx` owns the choice; this only reads it. -->
    <script>
      try {
        var theme = localStorage.getItem("dagents-theme");
        if (theme === "light" || theme === "dark") document.documentElement.setAttribute("data-theme", theme);
      } catch (error) {}
    </script>
    <meta name="description" content="Dagents runs a local agent at each data source and a global agent that combines their results. Typed planners decide what each request may see." />
    <!-- Link previews on LinkedIn, WhatsApp, Slack and X. Crawlers ignore a
         relative address, so social-meta.mjs replaces the PUBLIC_SITE_URL
         placeholder with the published address at build time. The pages live in
         the URL hash (#/learn, #/api), so every page shares these tags. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Dagents" />
    <meta property="og:title" content="Dagents" />
    <meta property="og:description" content="Dagents runs a local agent at each data source and a global agent that combines their results. Typed planners decide what each request may see." />
    <meta property="og:url" content="%PUBLIC_SITE_URL%" />
    <meta property="og:image" content="%PUBLIC_SITE_URL%social-preview.png" />
    <meta property="og:image:secure_url" content="%PUBLIC_SITE_URL%social-preview.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Dagents card: analytics and machine learning across data sources that can't be pooled, with a local agent at each source joined to a global agent." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Dagents" />
    <meta name="twitter:description" content="Dagents runs a local agent at each data source and a global agent that combines their results. Typed planners decide what each request may see." />
    <meta name="twitter:image" content="%PUBLIC_SITE_URL%social-preview.png" />
    <meta name="twitter:image:alt" content="The Dagents card: analytics and machine learning across data sources that can't be pooled, with a local agent at each source joined to a global agent." />
    <!-- The icons are rendered from design/social/ in the Dagents repository.
         The browser colour is the design system's ds-ground token in each theme. -->
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d1015" media="(prefers-color-scheme: dark)" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
